[pytest]
# 关键:只扫 tests/,不要碰 scripts/_archive/ 和 mobile/
# 历史问题:没有本文件时 pytest 从仓库根全盘扫描,scripts/_archive/*.py
#           里的冒烟脚本有模块级副作用,导致收集阶段 INTERNALERROR,
#           整个测试套件跑不起来。
testpaths = tests

# 明确排除
norecursedirs =
    scripts
    mobile
    venv
    .git
    __pycache__
    build
    dist
    .dart_tool
    *.egg-info
    node_modules
    output
    data

# *_test.py / test_*.py 都认,兼容历史命名
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 行为
addopts =
    --strict-markers
    -ra
    --tb=short

# 注意:本机未安装 pytest-timeout,故不设 timeout 项
#       (加了会报 Unknown config option)。需要时先 pip install pytest-timeout

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
