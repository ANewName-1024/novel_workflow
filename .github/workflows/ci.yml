# novel_workflow CI
# pytest gate + Flutter analyze + repo hygiene.
#
# Design notes
# ------------
# * `python -m pytest` with no path argument relies on pytest.ini (testpaths).
#   Passing an explicit path here re-introduced the original bug: without
#   testpaths, a bare pytest scans the repo root and scripts/_archive/*.py
#   breaks collection. Always run bare pytest so the config is the single
#   source of truth for what gets collected.
# * The matrix covers the interpreter the project actually runs on. Local dev
#   and VPS both use 3.14; keeping 3.12 catches accidental use of 3.13+ syntax.
# * python-tests is the merge gate. The hygiene job must not mask it.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python-version: "3.14" }   # production platform
          - { os: ubuntu-latest,   python-version: "3.12" }   # floor / portability
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify requirements are actually installable
        # Guards the failure mode where a mangled comment swallows a
        # dependency line and the install silently succeeds without it.
        run: |
          pip check

      - name: Run pytest
        # 失败摘要额外发成 workflow annotation。
        #
        # 为什么要多这一段: Actions 的日志正文只有带 token 才能读, 匿名 API 只能看到
        # "Process completed with exit code 1" 这一句。于是这个仓库的 CI 一旦变红,
        # 任何没有 token 的人(或 agent)都只能看到"红了", 看不到"为什么红"——
        # 2026-10-01 之前连续 5 次全红就是这么被忽略掉的。
        #
        # `::error::` 会被 Actions 解析成 annotation, 免密的
        # /repos/{owner}/{repo}/check-runs/{id}/annotations 就能读到失败用例名。
        # 这不是为了代替日志, 是为了让"红了"至少能自解释。
        run: |
          set +e
          python -m pytest -q --tb=short -rf --junitxml=pytest-junit.xml > pytest-out.txt 2>&1
          code=$?
          set -e
          cat pytest-out.txt
          if [ "$code" -ne 0 ]; then
            echo "::group::失败的用例"
            grep -E '^(FAILED|ERROR)' pytest-out.txt | head -n 30 | while IFS= read -r line; do
              # annotation 单行, 只需转义 % (CR/LF 已被 read 剥掉)
              echo "::error::${line//%/%25}"
            done
            echo "::endgroup::"
            # 收集阶段就崩时, 短摘要行比任何用例名都有用
            tail -n 25 pytest-out.txt | while IFS= read -r line; do
              echo "::error::pytest: ${line//%/%25}"
            done
          fi
          exit $code

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}-py${{ matrix.python-version }}
          path: pytest-junit.xml
          if-no-files-found: ignore

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check lib review_ui novel.py --select=E9,F63,F7,F82

  flutter-analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze

  repo-hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: No credential files in the tree
        # A real gate, not a warning: these must never be committed.
        run: |
          fail=0
          for f in .env .env.local; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f is tracked by git"
              fail=1
            fi
          done
          if git ls-files | grep -E '\.(pem|key|pfx|p12)$'; then
            echo "::error::private key material is tracked"
            fail=1
          fi
          exit $fail

      - name: Security review archive is present
        run: |
          test -d scripts/_security_rejected \
            || { echo "::error::scripts/_security_rejected/ missing (SSH patch archive)"; exit 1; }

      - name: Rejected patch files stay archived
        run: |
          if [ -f review_ui/app_log_ssh_endpoint_patch.txt ]; then
            echo "::error::rejected SSH patch still sitting in review_ui/"
            exit 1
          fi

      - name: No stray debug scripts in the test path
        # scripts/_archive/ must stay outside testpaths. If someone moves a
        # module-level-side-effect script into tests/, collection dies.
        run: |
          if git ls-files tests/ | grep -vE '^tests/(conftest\.py|test_[^/]*\.py)$'; then
            echo "::error::unexpected file(s) in tests/ -- pytest.ini testpaths assumes test_*.py only"
            exit 1
          fi

      - name: All text files are UTF-8 (no BOM)
        # Three classes of encoding drift sneak in: Windows Notepad saves
        # as UTF-16 LE by default; ps2exe stamps UTF-8 BOM at the front;
        # GBK-codepage shells mangle UTF-8 comments. Any of these turns a
        # text-processing script into a hard-to-diagnose encoding error.
        # The fix path is documented in tools/check_encoding.py:
        #     python tools/normalize_encoding.py --apply
        run: |
          python tools/check_encoding.py
